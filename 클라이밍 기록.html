<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클라이밍 기록</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1f2430; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14161c; --card:#1e2129; --text:#f0f1f4; --sub:#9aa0ab; --line:#2c303a; }
}
:root[data-theme="dark"]{ --bg:#14161c; --card:#1e2129; --text:#f0f1f4; --sub:#9aa0ab; --line:#2c303a; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{ background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  overscroll-behavior-y:none;
}
header{ position:sticky; top:0; z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;
  background:var(--bg); border-bottom:1px solid var(--line);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
h1{font-size:18px; margin:0 0 10px; font-weight:700;}
.tabs{display:flex; gap:6px;}
.tab{ flex:1; text-align:center; padding:9px 0; border-radius:10px; font-weight:700;
  background:var(--card); border:1px solid var(--line); color:var(--sub); cursor:pointer; font-size:15px;}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.navbar{display:flex; border-bottom:1px solid var(--line); margin-bottom:8px;}
.navitem{flex:1; text-align:center; padding:10px 0 9px; font-weight:700; font-size:15px;
  color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.navitem.active{color:var(--text); border-color:var(--accent);}
main{padding:12px 14px 40px; max-width:680px; margin:0 auto;}

.wallwrap{border-radius:14px; overflow:hidden; border:1px solid var(--line); margin-bottom:12px;}
.wallwrap img{display:block; width:100%; height:auto;}

.filtergroup{margin-bottom:8px;}
.filtergroup .glabel{font-size:11px; color:var(--sub); margin-bottom:5px;}
.chiprow{display:flex; gap:6px; flex-wrap:wrap;}
.chip{font-size:12px; padding:5px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--sub); cursor:pointer;}
.chip b{color:var(--text);}
.chip.on{color:#fff; border-color:transparent; font-weight:700;}
.clearbtn{font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; padding:5px 2px;}

.routes{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.route{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
.route-top{display:flex; align-items:center; gap:10px;}
.swatch{ width:38px; height:38px; border-radius:9px; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:800; font-size:14px; text-shadow:0 1px 2px rgba(0,0,0,.35);
  border:1px solid rgba(0,0,0,.08);}
.route-mid{flex:1; min-width:0;}
.route-mid .lv{font-size:12px; color:var(--sub); margin-bottom:4px;}
.statuses{display:flex; gap:4px; flex-wrap:wrap;}
.st-btn{ font-size:11px; padding:5px 7px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--sub); cursor:pointer; white-space:nowrap;}
.st-btn.sel{color:#fff; border-color:transparent; font-weight:700;}
.del{ flex:none; width:26px; height:26px; border-radius:50%; border:none; background:var(--bg);
  color:var(--sub); font-size:14px; cursor:pointer; line-height:1;}
.histpanel{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:5px;}
.histrow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text);}
.histdot{width:9px; height:9px; border-radius:50%; flex:none;}
.histtxt{flex:1;}
.histdel{flex:none; border:none; background:none; color:var(--sub); font-size:12px; cursor:pointer;}

.addbox{ margin-top:16px; padding:12px; background:var(--card); border:1px dashed var(--line); border-radius:14px;}
.addbox .row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.addbox select, .addbox input{ flex:1; min-width:80px; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:14px;}
.addbox button{ width:100%; padding:10px; border-radius:9px; border:none; background:var(--accent); color:#fff;
  font-weight:700; font-size:14px; cursor:pointer;}
.imgrow{display:flex; gap:8px; margin-top:8px;}
.imgrow label, .imgrow button{ flex:1; text-align:center; padding:8px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--sub); font-size:12px; cursor:pointer;}
.imgrow input[type=file]{display:none;}
.empty{color:var(--sub); font-size:14px; text-align:center; padding:30px 0;}

.calnav{display:flex; align-items:center; justify-content:space-between; margin:10px 0;}
.calnav button{border:none; background:var(--card); border:1px solid var(--line); color:var(--text);
  width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer;}
.calmonth{font-weight:700; font-size:15px;}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.calhead{text-align:center; font-size:11px; color:var(--sub); padding:4px 0;}
.calday{aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--card);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer; font-size:13px; position:relative;}
.calday.empty2{visibility:hidden; cursor:default;}
.calday.today{border-color:var(--accent); border-width:2px;}
.calday.sel{background:var(--accent); color:#fff;}
.caldots{display:flex; gap:2px;}
.caldot{width:6px; height:6px; border-radius:50%;}
.daydetail-title{font-weight:700; font-size:14px; margin:16px 0 8px;}
.levelhead{display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px;
  margin-bottom:6px; cursor:pointer;}
.levelname{font-weight:700; font-size:13px; flex:none;}
.levelcounts{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; font-size:12px; font-weight:600;}
.applybar{display:flex; gap:8px; margin-top:14px;}
.applybar button{flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;}
.applybar button:not(.secondary){background:var(--accent); color:#fff;}
.applybar button.secondary{background:var(--card); color:var(--sub); border:1px solid var(--line);}
.stagerow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:8px 12px;}
.stagerow .swatch{width:34px; height:34px;}
.dayentry{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:8px 10px; margin-bottom:6px; font-size:13px;}
.dayentry .sectorbadge{flex:none; width:22px; height:22px; border-radius:6px; background:var(--bg);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px;}
.dayentry .swatch2{flex:none; width:26px; height:26px; border-radius:7px; display:flex; align-items:center;
  justify-content:center; color:#fff; font-weight:800; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.35);}
.dayentry .stlabel{flex:1; font-weight:600;}
</style>
</head>
<body>
<header>
  <h1>🧗 클라이밍 기록</h1>
  <div class="navbar" id="pageTabs"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="routesPage">
    <div id="wallArea"></div>
    <div class="filtergroup">
      <div class="glabel">상태 필터 (탭해서 선택/해제)</div>
      <div class="chiprow" id="statusFilterRow"></div>
    </div>
    <div class="filtergroup">
      <div class="glabel">레벨 필터</div>
      <div class="chiprow" id="levelFilterRow"></div>
    </div>
    <div class="routes" id="routes"></div>
    <div class="addbox">
      <div class="row">
        <select id="newColor"></select>
        <input id="newLevel" placeholder="난이도 (예: 4, 4/7)" />
      </div>
      <button id="addBtn">+ 루트 추가</button>
      <div class="imgrow">
        <label for="imgFile">배치도 이미지</label>
        <input type="file" id="imgFile" accept="image/*">
        <button id="removeImg">배치도 삭제</button>
      </div>
    </div>
  </div>
  <div id="calendarPage" style="display:none">
    <div class="calnav">
      <button id="prevMonth">◀</button>
      <div class="calmonth" id="calMonthLabel"></div>
      <button id="nextMonth">▶</button>
    </div>
    <div class="calgrid" id="calGrid"></div>
    <div id="dayDetail"></div>
  </div>
  <div id="registerPage" style="display:none">
    <div class="tabs" id="regTabs"></div>
    <div class="glabel" style="margin:8px 0 4px">이 섹터를 새 문제로 교체합니다. 기존 기록은 달력에 그대로 남아요.</div>
    <div id="regWallArea"></div>
    <div class="imgrow" style="margin-top:8px">
      <label for="regImgFile">새 배치도 사진</label>
      <input type="file" id="regImgFile" accept="image/*">
      <button id="regRemoveImg">사진 제거</button>
    </div>
    <div class="addbox" style="margin-top:14px">
      <div class="glabel">새로 등록할 문제 (하나씩 추가)</div>
      <div class="row">
        <select id="regColor"></select>
        <input id="regLevel" placeholder="난이도 (예: 4, 4/7)" />
      </div>
      <button id="regAddBtn">+ 목록에 추가</button>
    </div>
    <div class="routes" id="regStagingList" style="margin-top:10px"></div>
    <div class="applybar" id="regApplyBar" style="display:none">
      <button id="regApplyBtn">이 섹터에 적용하기</button>
      <button id="regClearBtn" class="secondary">목록 비우기</button>
    </div>
  </div>
</main>


<script>
const SECTIONS = ["A","B","C","D"];
const STATUSES = [
  {key:"before",  label:"도전 전", color:"#9CA3AF"},
  {key:"fail",    label:"실패",   color:"#EF4444"},
  {key:"doable",  label:"할만함", color:"#F59E0B"},
  {key:"split",   label:"나눠서", color:"#3B82F6"},
  {key:"success", label:"성공",   color:"#22C55E"},
];
const COLORS = [
  {key:"purple", label:"보라", hex:"#8B5CF6"},
  {key:"skyblue",label:"하늘", hex:"#38BDF8"},
  {key:"blue",   label:"파랑", hex:"#2563EB"},
  {key:"red",    label:"빨강", hex:"#EF4444"},
  {key:"green",  label:"초록", hex:"#22C55E"},
  {key:"lime",   label:"연두", hex:"#A3E635"},
  {key:"yellow", label:"노랑", hex:"#EAB308"},
  {key:"pink",   label:"분홍", hex:"#EC4899"},
  {key:"orange", label:"주황", hex:"#F97316"},
  {key:"brown",  label:"갈색", hex:"#92400E"},
  {key:"black",  label:"검정", hex:"#1F2937"},
  {key:"gray",   label:"회색", hex:"#9CA3AF"},
  {key:"white",  label:"흰색", hex:"#D1D5DB"},
];
const colorHex = k => (COLORS.find(c=>c.key===k)||{}).hex || "#999";
const colorLbl = k => (COLORS.find(c=>c.key===k)||{}).label || k;
const RANK = {before:0, fail:1, doable:2, split:3, success:4};
const stLabel = k => (STATUSES.find(s=>s.key===k)||{}).label || k;
const stColor = k => (STATUSES.find(s=>s.key===k)||{}).color || "#999";
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtShort(d){ if(!d) return ""; const p=d.split("-"); return parseInt(p[1])+"/"+parseInt(p[2]); }
function fmtFull(d){ return d ? d.replaceAll("-",".") : ""; }
function bestOf(history){
  if(!history || history.length===0) return {status:"before", date:null};
  let bestRank=-1, bestStatus="before";
  history.forEach(h=>{ const rk=RANK[h.status]; if(rk>bestRank){bestRank=rk; bestStatus=h.status;} });
  const dates = history.filter(h=>h.status===bestStatus).map(h=>h.date).sort();
  return {status:bestStatus, date:dates[0]};
}
function latestOf(history){
  return (history && history.length) ? history[history.length-1] : {status:"before", date:null};
}

const KEY = "climbing_tracker_v4";
const OLD_KEY = "climbing_tracker_v3";
function migrateRoute(r){
  if(r.history) return r;
  const history = (r.status && r.status !== "before") ? [{status:r.status, date:todayStr()}] : [];
  return {id:r.id, color:r.color, level:r.level, history};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      SECTIONS.forEach(s=>{ d[s].routes = d[s].routes.map(migrateRoute); });
      if(!d.archive) d.archive = [];
      return d;
    }
    const old = localStorage.getItem(OLD_KEY);
    if(old){
      const d = JSON.parse(old);
      SECTIONS.forEach(s=>{ d[s].routes = d[s].routes.map(migrateRoute); });
      d.archive = [];
      return d;
    }
  }catch(e){}
  return {
    A:{image:WALL_A_IMG, routes:DEFAULT_A},
    B:{image:WALL_B_IMG, routes:DEFAULT_B},
    C:{image:WALL_C_IMG, routes:DEFAULT_C},
    D:{image:null, routes:[]},
    archive:[],
  };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
let data = load();
let current = "C";
let statusFilter = [];
let levelFilter = [];
let expanded = new Set();

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  SECTIONS.forEach(s=>{
    const b = document.createElement("div");
    b.className = "tab" + (s===current?" active":"");
    b.textContent = "Sector " + s;
    b.onclick = ()=>{ current = s; renderAll(); };
    el.appendChild(b);
  });
}

  const sec = data[current];
  const lbl = document.querySelector('label[for="imgFile"]');
  lbl.textContent = sec.image ? "배치도 변경" : "배치도 추가";
  document.getElementById("removeImg").style.display = sec.image ? "block":"none";
  if(!sec.image) return;
  const wrap = document.createElement("div");
  wrap.className = "wallwrap";
  const img = document.createElement("img");
  img.src = sec.image;
  wrap.appendChild(img);
  wa.appendChild(wrap);
}

function renderStatusFilter(){
  const el = document.getElementById("statusFilterRow");
  el.innerHTML = "";
  const list = data[current].routes;
  STATUSES.forEach(st=>{
    const n = list.filter(r=>bestOf(r.history).status===st.key).length;
    const on = statusFilter.includes(st.key);
    const c = document.createElement("span");
    c.className = "chip" + (on ? " on":"");
    if(on) c.style.background = st.color;
    c.innerHTML = st.label + " <b>" + n + "</b>";
    c.onclick = ()=>{
      statusFilter = on ? statusFilter.filter(x=>x!==st.key) : [...statusFilter, st.key];
      renderAll();
    };
    el.appendChild(c);
  });
  if(statusFilter.length){
    const clr = document.createElement("button");
    clr.className = "clearbtn"; clr.textContent = "지우기";
    clr.onclick = ()=>{ statusFilter=[]; renderAll(); };
    el.appendChild(clr);
  }
}

function renderLevelFilter(){
  const el = document.getElementById("levelFilterRow");
  el.innerHTML = "";
  const list = data[current].routes;
  const levels = [...new Set(list.map(r=>r.level))].sort((a,b)=>{
    const na = parseFloat(a), nb = parseFloat(b);
    return (na||0) - (nb||0);
  });
  if(levels.length===0){ el.innerHTML='<span style="font-size:11px;color:var(--sub)">루트를 추가하면 표시돼요</span>'; return; }
  levels.forEach(lv=>{
    const n = list.filter(r=>r.level===lv).length;
    const on = levelFilter.includes(lv);
    const c = document.createElement("span");
    c.className = "chip" + (on ? " on":"");
    if(on) c.style.background = "var(--accent)";
    c.innerHTML = "Lv " + lv + " <b>" + n + "</b>";
    c.onclick = ()=>{
      levelFilter = on ? levelFilter.filter(x=>x!==lv) : [...levelFilter, lv];
      renderAll();
    };
    el.appendChild(c);
  });
  if(levelFilter.length){
    const clr = document.createElement("button");
    clr.className = "clearbtn"; clr.textContent = "지우기";
    clr.onclick = ()=>{ levelFilter=[]; renderAll(); };
    el.appendChild(clr);
  }
}

function renderRoutes(){
  const el = document.getElementById("routes");
  el.innerHTML = "";
  let list = data[current].routes;
  if(statusFilter.length) list = list.filter(r=>statusFilter.includes(bestOf(r.history).status));
  if(levelFilter.length) list = list.filter(r=>levelFilter.includes(r.level));

  if(list.length===0){
    el.innerHTML = '<div class="empty">'+(data[current].routes.length===0 ? '아직 등록된 루트가 없어요. 아래에서 추가해보세요.' : '조건에 맞는 루트가 없어요.')+'</div>';
    return;
  }
  list.forEach(r=>{
    const row = document.createElement("div");
    row.className = "route";

    const top = document.createElement("div");
    top.className = "route-top";

    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = colorHex(r.color);
    sw.textContent = r.level;
    top.appendChild(sw);

    const mid = document.createElement("div");
    mid.className = "route-mid";
    const lv = document.createElement("div");
    lv.className = "lv";
    lv.style.cursor = "pointer";
    const best = bestOf(r.history);
    const bestTxt = best.status==="before" ? "도전 전" : (stLabel(best.status) + " · " + fmtShort(best.date));
    lv.textContent = colorLbl(r.color) + " · Lv " + r.level + " · " + bestTxt + (expanded.has(r.id) ? " ▲" : " ▾");
    lv.onclick = ()=>{
      if(expanded.has(r.id)) expanded.delete(r.id); else expanded.add(r.id);
      renderAll();
    };
    mid.appendChild(lv);

    const sts = document.createElement("div");
    sts.className = "statuses";
    const latest = latestOf(r.history);
    STATUSES.forEach(st=>{
      const b = document.createElement("button");
      b.className = "st-btn" + (latest.status===st.key ? " sel":"");
      b.textContent = st.label;
      if(latest.status===st.key) b.style.background = st.color;
      b.onclick = ()=>{
        r.history = r.history || [];
        r.history.push({status:st.key, date:todayStr()});
        save(); renderAll();
      };
      sts.appendChild(b);
    });
    mid.appendChild(sts);
    top.appendChild(mid);

    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = ()=>{
      data[current].routes = data[current].routes.filter(x=>x.id!==r.id);
      save(); renderAll();
    };
    top.appendChild(del);
    row.appendChild(top);

    if(expanded.has(r.id)){
      const hist = document.createElement("div");
      hist.className = "histpanel";
      const sorted = [...(r.history||[])].sort((a,b)=> b.date.localeCompare(a.date));
      if(sorted.length===0){
        hist.innerHTML = '<div class="histrow" style="color:var(--sub)">아직 기록이 없어요.</div>';
      }else{
        sorted.forEach(h=>{
          const hr = document.createElement("div");
          hr.className = "histrow";
          const dot = document.createElement("span");
          dot.className = "histdot";
          dot.style.background = stColor(h.status);
          hr.appendChild(dot);
          const txt = document.createElement("span");
          txt.className = "histtxt";
          txt.textContent = fmtFull(h.date) + " · " + stLabel(h.status);
          hr.appendChild(txt);
          const hdel = document.createElement("button");
          hdel.className = "histdel";
          hdel.textContent = "✕";
          hdel.onclick = ()=>{
            const idx = r.history.findIndex(x=>x.status===h.status && x.date===h.date);
            if(idx>-1) r.history.splice(idx,1);
            save(); renderAll();
          };
          hr.appendChild(hdel);
          hist.appendChild(hr);
        });
      }
      row.appendChild(hist);
    }

    el.appendChild(row);
  });
}

function renderAddForm(){
  const sel = document.getElementById("newColor");
  if(sel.options.length===0){
    COLORS.forEach(c=>{
      const o = document.createElement("option");
      o.value = c.key; o.textContent = c.label;
      sel.appendChild(o);
    });
  }
}

document.getElementById("addBtn").onclick = ()=>{
  const color = document.getElementById("newColor").value;
  const level = document.getElementById("newLevel").value.trim();
  if(!level){ document.getElementById("newLevel").focus(); return; }
  data[current].routes.push({id:"r"+Date.now()+Math.random().toString(36).slice(2,6), color, level, history:[]});
  document.getElementById("newLevel").value = "";
  save(); renderAll();
};

document.getElementById("imgFile").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ data[current].image = reader.result; save(); renderAll(); };
  reader.readAsDataURL(f);
  e.target.value = "";
});
document.getElementById("removeImg").onclick = ()=>{ data[current].image = null; save(); renderAll(); };

let page = "routes";
let calMonth = new Date(); calMonth.setDate(1);
let selectedDay = todayStr();
let expandedLevels = new Set();

function renderPageTabs(){
  const el = document.getElementById("pageTabs");
  el.innerHTML = "";
  [["routes","문제"],["calendar","달력"],["register","등록"]].forEach(([key,label])=>{
    const b = document.createElement("div");
    b.className = "navitem" + (page===key ? " active":"");
    b.textContent = label;
    b.onclick = ()=>{ page = key; renderAll(); };
    el.appendChild(b);
  });
}

function getAllEntries(){
  const out = [...(data.archive||[])];
  SECTIONS.forEach(s=>{
    data[s].routes.forEach(r=>{
      (r.history||[]).forEach(h=>{
        out.push({sector:s, routeId:r.id, color:r.color, level:r.level, status:h.status, date:h.date});
      });
    });
  });
  return out;
}

function buildDayMap(){
  const raw = getAllEntries();
  const byDay = {};
  raw.forEach(e=>{
    const day = byDay[e.date] = byDay[e.date] || {};
    const key = e.sector + "|" + e.routeId;
    if(!day[key] || RANK[e.status] > RANK[day[key].status]) day[key] = e;
  });
  const result = {};
  Object.keys(byDay).forEach(d=>{ result[d] = Object.values(byDay[d]); });
  return result;
}

function renderCalendar(){
  const byDate = buildDayMap();

  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("calMonthLabel").textContent = y + "년 " + (m+1) + "월";

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  ["일","월","화","수","목","금","토"].forEach(d=>{
    const h = document.createElement("div");
    h.className = "calhead"; h.textContent = d;
    grid.appendChild(h);
  });
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayS = todayStr();

  for(let i=0;i<firstDow;i++){
    const e = document.createElement("div");
    e.className = "calday empty2";
    grid.appendChild(e);
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const cell = document.createElement("div");
    cell.className = "calday" + (ds===todayS ? " today":"") + (ds===selectedDay ? " sel":"");
    const num = document.createElement("div");
    num.textContent = d;
    cell.appendChild(num);
    const dayEntries = byDate[ds];
    if(dayEntries && dayEntries.length){
      const dots = document.createElement("div");
      dots.className = "caldots";
      const statuses = [...new Set(dayEntries.map(e=>e.status))].slice(0,4);
      statuses.forEach(st=>{
        const dot = document.createElement("span");
        dot.className = "caldot";
        dot.style.background = stColor(st);
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
    cell.onclick = ()=>{ selectedDay = ds; expandedLevels = new Set(); renderAll(); };
    grid.appendChild(cell);
  }

  renderDayDetail(byDate);
}

function renderDayDetail(byDate){
  const el = document.getElementById("dayDetail");
  el.innerHTML = "";
  if(!selectedDay){ return; }
  const title = document.createElement("div");
  title.className = "daydetail-title";
  title.textContent = fmtFull(selectedDay) + " 기록";
  el.appendChild(title);
  const list = byDate[selectedDay];
  if(!list || list.length===0){
    el.innerHTML += '<div class="empty">이 날짜엔 기록이 없어요.</div>';
    return;
  }
  const byLevel = {};
  list.forEach(e=>{ (byLevel[e.level] = byLevel[e.level] || []).push(e); });
  const levels = Object.keys(byLevel).sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0));

  levels.forEach(lv=>{
    const entries = byLevel[lv];
    const counts = {};
    entries.forEach(e=>{ counts[e.status] = (counts[e.status]||0) + 1; });

    const head = document.createElement("div");
    head.className = "levelhead";
    const lvTitle = document.createElement("span");
    lvTitle.className = "levelname";
    lvTitle.textContent = "Lv " + lv + (expandedLevels.has(lv) ? " ▲" : " ▾");
    head.appendChild(lvTitle);
    const countsWrap = document.createElement("span");
    countsWrap.className = "levelcounts";
    STATUSES.forEach(st=>{
      if(counts[st.key]){
        const c = document.createElement("span");
        c.className = "levelcount";
        c.style.color = st.color;
        c.textContent = st.label + " " + counts[st.key];
        countsWrap.appendChild(c);
      }
    });
    head.appendChild(countsWrap);
    head.onclick = ()=>{
      if(expandedLevels.has(lv)) expandedLevels.delete(lv); else expandedLevels.add(lv);
      renderAll();
    };
    el.appendChild(head);

    if(expandedLevels.has(lv)){
      entries.forEach(e=>{
        const row = document.createElement("div");
        row.className = "dayentry";
        const badge = document.createElement("div");
        badge.className = "sectorbadge";
        badge.textContent = e.sector;
        row.appendChild(badge);
        const sw = document.createElement("div");
        sw.className = "swatch2";
        sw.style.background = colorHex(e.color);
        sw.textContent = e.level;
        row.appendChild(sw);
        const lbl = document.createElement("div");
        lbl.className = "stlabel";
        lbl.textContent = stLabel(e.status);
        lbl.style.color = stColor(e.status);
        row.appendChild(lbl);
        el.appendChild(row);
      });
    }
  });
}

document.getElementById("prevMonth").onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()-1); renderAll(); };
document.getElementById("nextMonth").onclick = ()=>{ calMonth.setMonth(calMonth.getMonth()+1); renderAll(); };

let regSector = "A";
let regStaging = [];
let regPendingImage = undefined; // undefined = keep existing, null = removed, string = new

function renderRegTabs(){
  const el = document.getElementById("regTabs");
  el.innerHTML = "";
  SECTIONS.forEach(s=>{
    const b = document.createElement("div");
    b.className = "tab" + (s===regSector ? " active":"");
    b.textContent = "Sector " + s;
    b.onclick = ()=>{ regSector = s; regStaging = []; regPendingImage = undefined; renderAll(); };
    el.appendChild(b);
  });
}

function renderRegWall(){
  const wa = document.getElementById("regWallArea");
  wa.innerHTML = "";
  const img = regPendingImage !== undefined ? regPendingImage : data[regSector].image;
  document.getElementById("regRemoveImg").style.display = img ? "block":"none";
  if(!img) return;
  const wrap = document.createElement("div");
  wrap.className = "wallwrap";
  const im = document.createElement("img");
  im.src = img;
  wrap.appendChild(im);
  wa.appendChild(wrap);
}

function renderRegColorOptions(){
  const sel = document.getElementById("regColor");
  if(sel.options.length===0){
    COLORS.forEach(c=>{
      const o = document.createElement("option");
      o.value = c.key; o.textContent = c.label;
      sel.appendChild(o);
    });
  }
}

function renderRegStaging(){
  const el = document.getElementById("regStagingList");
  el.innerHTML = "";
  const currentCount = data[regSector].routes.length;
  const note = document.createElement("div");
  note.className = "glabel";
  note.textContent = "새로 담은 문제 " + regStaging.length + "개 (현재 이 섹터엔 " + currentCount + "개가 등록돼 있어요)";
  el.appendChild(note);
  regStaging.forEach((r,idx)=>{
    const row = document.createElement("div");
    row.className = "stagerow";
    const sw = document.createElement("div");
    sw.className = "swatch";
    sw.style.background = colorHex(r.color);
    sw.textContent = r.level;
    row.appendChild(sw);
    const lbl = document.createElement("div");
    lbl.style.flex = "1";
    lbl.style.fontSize = "13px";
    lbl.textContent = colorLbl(r.color) + " · Lv " + r.level;
    row.appendChild(lbl);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.onclick = ()=>{ regStaging.splice(idx,1); renderAll(); };
    row.appendChild(del);
    el.appendChild(row);
  });
  document.getElementById("regApplyBar").style.display = regStaging.length ? "flex":"none";
}

document.getElementById("regAddBtn").onclick = ()=>{
  const color = document.getElementById("regColor").value;
  const level = document.getElementById("regLevel").value.trim();
  if(!level){ document.getElementById("regLevel").focus(); return; }
  regStaging.push({color, level});
  document.getElementById("regLevel").value = "";
  renderAll();
};

document.getElementById("regImgFile").addEventListener("change", (e)=>{
  const f = e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ regPendingImage = reader.result; renderAll(); };
  reader.readAsDataURL(f);
  e.target.value = "";
});
document.getElementById("regRemoveImg").onclick = ()=>{ regPendingImage = null; renderAll(); };

document.getElementById("regClearBtn").onclick = ()=>{ regStaging = []; renderAll(); };

document.getElementById("regApplyBtn").onclick = ()=>{
  const ok = confirm("Sector " + regSector + "의 기존 문제 " + data[regSector].routes.length + "개를 새 문제 " + regStaging.length + "개로 교체할까요?\n(과거 기록은 달력에 그대로 보존돼요)");
  if(!ok) return;
  data.archive = data.archive || [];
  data[regSector].routes.forEach(r=>{
    (r.history||[]).forEach(h=>{
      data.archive.push({sector:regSector, routeId:r.id, color:r.color, level:r.level, status:h.status, date:h.date});
    });
  });
  data[regSector].routes = regStaging.map((r,i)=>({
    id:"n"+Date.now()+i+Math.random().toString(36).slice(2,5),
    color:r.color, level:r.level, history:[]
  }));
  if(regPendingImage !== undefined) data[regSector].image = regPendingImage;
  save();
  regStaging = [];
  regPendingImage = undefined;
  current = regSector;
  page = "routes";
  renderAll();
};

function renderRegisterPage(){
  renderRegTabs();
  renderRegWall();
  renderRegColorOptions();
  renderRegStaging();
}

function renderAll(){
  renderPageTabs();
  document.getElementById("routesPage").style.display = page==="routes" ? "block":"none";
  document.getElementById("calendarPage").style.display = page==="calendar" ? "block":"none";
  document.getElementById("registerPage").style.display = page==="register" ? "block":"none";
  document.getElementById("tabs").style.display = page==="routes" ? "flex":"none";
  if(page==="routes"){
    renderTabs();
    renderWall();
    renderStatusFilter();
    renderLevelFilter();
    renderRoutes();
  }else if(page==="calendar"){
    renderCalendar();
  }else{
    renderRegisterPage();
  }
}
renderAddForm();
renderAll();
</script>
</body>
</html>
