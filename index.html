<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>클라이밍 기록</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1f2430; --sub:#6b7280; --line:#e5e7eb;
  --accent:#2563eb;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#14161c; --card:#1e2129; --text:#f0f1f4; --sub:#9aa0ab; --line:#2c303a; }
}
:root[data-theme="dark"]{ --bg:#14161c; --card:#1e2129; --text:#f0f1f4; --sub:#9aa0ab; --line:#2c303a; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{ background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  overscroll-behavior-y:none;
}
header{ position:sticky; top:0; z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;
  background:var(--bg); border-bottom:1px solid var(--line);
  scroll-padding-top:env(safe-area-inset-top,0px);
}
h1{font-size:18px; margin:0; font-weight:700;}
.titlerow{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.refreshbtn{border:1px solid var(--line); background:var(--card); color:var(--text);
  width:32px; height:32px; border-radius:9px; font-size:15px; cursor:pointer;}
.refreshbtn.spinning{animation:spin 0.8s linear infinite;}
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.tabs{display:flex; gap:6px;}
.tab{ flex:1; text-align:center; padding:9px 0; border-radius:10px; font-weight:700;
  background:var(--card); border:1px solid var(--line); color:var(--sub); cursor:pointer; font-size:15px;}
.tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
.navbar{display:flex; border-bottom:1px solid var(--line); margin-bottom:8px;}
.navitem{flex:1; text-align:center; padding:10px 0 9px; font-weight:700; font-size:15px;
  color:var(--sub); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.navitem.active{color:var(--text); border-color:var(--accent);}
main{padding:12px 14px 40px; max-width:680px; margin:0 auto;}

.sectorinfo{font-size:12px; color:var(--sub); margin:8px 0 4px;}
.sectorinfo b{color:var(--text);}

.wallwrap{border-radius:14px; overflow:hidden; border:1px solid var(--line); margin-bottom:12px; user-select:none; -webkit-user-select:none; touch-action:pan-y;}
.wallwrap img{display:block; width:100%; height:auto; pointer-events:none;}
.wallplaceholder{border-radius:14px; border:1px dashed var(--line); margin-bottom:12px; padding:26px 12px;
  text-align:center; color:var(--sub); font-size:13px; user-select:none; touch-action:pan-y;}
.backbtn{border:none; background:none; color:var(--accent); font-weight:700; font-size:13px; padding:4px 0 10px; cursor:pointer;}

.filtergroup{margin-bottom:8px;}
.filtergroup .glabel{font-size:11px; color:var(--sub); margin-bottom:5px;}
.chiprow{display:flex; gap:6px; flex-wrap:wrap;}
.chip{font-size:12px; padding:5px 10px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--sub); cursor:pointer;}
.chip b{color:var(--text);}
.chip.on{color:#fff; border-color:transparent; font-weight:700;}
.clearbtn{font-size:12px; color:var(--accent); background:none; border:none; cursor:pointer; padding:5px 2px;}

.routes{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.route{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;}
.route-top{display:flex; align-items:center; gap:10px;}
.swatch{ width:38px; height:38px; border-radius:9px; flex:none;
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:14px;
  border:1px solid rgba(0,0,0,.08);}
.route-mid{flex:1; min-width:0;}
.route-mid .lv{font-size:12px; color:var(--sub); margin-bottom:4px;}
.statuses{display:flex; gap:4px; flex-wrap:wrap;}
.st-btn{ font-size:11px; padding:5px 7px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--sub); cursor:pointer; white-space:nowrap;}
.st-btn.sel{color:#fff; border-color:transparent; font-weight:700;}
.del{ flex:none; width:26px; height:26px; border-radius:50%; border:none; background:var(--bg);
  color:var(--sub); font-size:14px; cursor:pointer; line-height:1;}
.histpanel{margin-top:8px; padding-top:8px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:5px;}
.histrow{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text);}
.histdot{width:9px; height:9px; border-radius:50%; flex:none;}
.histtxt{flex:1;}
.histdel{flex:none; border:none; background:none; color:var(--sub); font-size:12px; cursor:pointer;}

.addbox{ margin-top:16px; padding:12px; background:var(--card); border:1px dashed var(--line); border-radius:14px;}
.addbox .row{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
.addbox select, .addbox input{ flex:1; min-width:80px; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:14px;}
.addbox button{ width:100%; padding:10px; border-radius:9px; border:none; background:var(--accent); color:#fff;
  font-weight:700; font-size:14px; cursor:pointer;}
.imgrow{display:flex; gap:8px; margin-top:8px;}
.imgrow label, .imgrow button{ flex:1; text-align:center; padding:8px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--sub); font-size:12px; cursor:pointer;}
.imgrow input[type=file]{display:none;}
.empty{color:var(--sub); font-size:14px; text-align:center; padding:30px 0;}

.calnav{display:flex; align-items:center; justify-content:space-between; margin:10px 0;}
.calnav button{border:none; background:var(--card); border:1px solid var(--line); color:var(--text);
  width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer;}
.calmonth{font-weight:700; font-size:15px;}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.calhead{text-align:center; font-size:11px; color:var(--sub); padding:4px 0;}
.calday{aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--card);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  cursor:pointer; font-size:13px; position:relative;}
.calday.empty2{visibility:hidden; cursor:default;}
.calday.today{border-color:var(--accent); border-width:2px;}
.calday.sel{background:var(--accent); color:#fff;}
.caldots{display:flex; gap:2px;}
.caldot{width:6px; height:6px; border-radius:50%;}
.daydetail-title{font-weight:700; font-size:14px; margin:16px 0 8px;}
.levelhead{display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 12px;
  margin-bottom:6px; cursor:pointer;}
.levelname{font-weight:700; font-size:13px; flex:none;}
.levelcounts{display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; font-size:12px; font-weight:600;}
.applybar{display:flex; gap:8px; margin-top:14px;}
.applybar button{flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;}
.applybar button:not(.secondary){background:var(--accent); color:#fff;}
.applybar button.secondary{background:var(--card); color:var(--sub); border:1px solid var(--line);}
.stagerow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:8px 12px;}
.stagerow .swatch{width:34px; height:34px;}
.dayentry{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:8px 10px; margin-bottom:6px; font-size:13px;}
.dayentry .sectorbadge{flex:none; width:22px; height:22px; border-radius:6px; background:var(--bg);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:11px;}
.dayentry .swatch2{flex:none; width:26px; height:26px; border-radius:7px; display:flex; align-items:center;
  justify-content:center; font-weight:800; font-size:12px;}
.dayentry .stlabel{flex:1; font-weight:600;}
.wallplaceholder{border-radius:14px; border:1px dashed var(--line); margin-bottom:12px; padding:26px 12px;
  text-align:center; color:var(--sub); font-size:13px;}

.regfield{display:flex; flex-direction:column; gap:4px; margin-bottom:8px;}
.regfield label{font-size:11px; color:var(--sub);}
.regfield input{padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px;}
.colorfields{display:flex; gap:12px; margin-bottom:8px;}
.colorfield{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; color:var(--sub);}
.colorfield input[type=color]{width:46px; height:36px; border-radius:8px; border:1px solid var(--line); padding:2px; background:var(--card);}
.pickbtn{width:100%; padding:9px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:13px; cursor:pointer; margin-bottom:8px;}
#colorPickCanvas{width:100%; height:auto; border-radius:10px; border:1px solid var(--line); cursor:crosshair; display:block; margin-bottom:8px;}
.colorlist{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.coloritem{display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:4px 10px 4px 4px; font-size:12px;}
.coloritem .cdot{width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800;}
.coloritem .cdel{border:none; background:none; color:var(--sub); cursor:pointer; font-size:12px;}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>🧗 클라이밍 기록</h1>
    <button id="refreshBtn" class="refreshbtn" title="공유 저장소에서 최신 문제 불러오기">🔄</button>
  </div>
  <div class="navbar" id="pageTabs"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="routesPage">
    <div class="sectorinfo" id="sectorInfo"></div>
    <div id="wallArea"></div>
    <div class="filtergroup">
      <div class="glabel">상태 필터 (탭해서 선택/해제)</div>
      <div class="chiprow" id="statusFilterRow"></div>
    </div>
    <div class="filtergroup">
      <div class="glabel">레벨 필터</div>
      <div class="chiprow" id="levelFilterRow"></div>
    </div>
    <div class="routes" id="routes"></div>
    <div class="addbox">
      <div class="glabel">빠른 추가 (색상은 등록 페이지에서 미리 등록해야 목록에 보여요)</div>
      <div class="row">
        <select id="newColor"></select>
        <input id="newLevel" placeholder="난이도 (예: 4, 4/7)" />
      </div>
      <button id="addBtn">+ 루트 추가</button>
    </div>
  </div>

  <div id="calendarPage" style="display:none">
    <div class="calnav">
      <button id="prevMonth">◀</button>
      <div class="calmonth" id="calMonthLabel"></div>
      <button id="nextMonth">▶</button>
    </div>
    <div class="calgrid" id="calGrid"></div>
    <div id="dayDetail"></div>
  </div>

  <div id="registerPage" style="display:none">
    <button id="regBackBtn" class="backbtn">← 문제 페이지로</button>
    <div class="tabs" id="regTabs"></div>
    <div class="glabel" id="sharedStatusMsg" style="margin:10px 0"></div>

    <div class="regfield">
      <label>테마 (이번 주 섹터 이름, 예: 골반)</label>
      <input id="regTheme" placeholder="예: 골반" />
    </div>
    <div class="regfield">
      <label>변경 날짜 (기본값: 오늘)</label>
      <input id="regChangeDate" type="date" />
    </div>

    <div id="regWallArea"></div>
    <div class="imgrow" style="margin-top:8px">
      <label for="regImgFile">새 배치도 사진</label>
      <input type="file" id="regImgFile" accept="image/*">
      <button id="regRemoveImg">사진 제거</button>
    </div>

    <div class="addbox" style="margin-top:14px">
      <div class="glabel">새로 등록할 문제 (하나씩 추가)</div>
      <div class="row">
        <select id="regColor"></select>
        <input id="regLevel" placeholder="난이도 (예: 4, 4/7)" />
      </div>
      <button id="regAddBtn">+ 목록에 추가</button>
    </div>
    <div class="routes" id="regStagingList" style="margin-top:10px"></div>
    <div class="applybar" id="regApplyBar" style="display:none">
      <button id="regApplyBtn">이 섹터에 적용하기</button>
      <button id="regClearBtn" class="secondary">목록 비우기</button>
    </div>

    <button id="colorPanelToggle" type="button" class="pickbtn" style="margin-top:18px">🎨 색상 설정</button>
    <div class="addbox" id="colorPanel" style="margin-top:8px; display:none">
      <div class="glabel">색상 등록</div>
      <div class="regfield">
        <label>색상 이름</label>
        <input id="newColorLabel" placeholder="예: 보라" />
      </div>
      <div class="colorfields">
        <div class="colorfield">배경색<input type="color" id="newColorBg" value="#8b5cf6"></div>
        <div class="colorfield">글자색<input type="color" id="newColorText" value="#ffffff"></div>
      </div>
      <button id="pickBgFromImgBtn" type="button" class="pickbtn">🎯 사진에서 배경색 뽑기</button>
      <button id="pickTextFromImgBtn" type="button" class="pickbtn">🎯 사진에서 글자색 뽑기</button>
      <div id="colorPickWrap" style="display:none">
        <div class="glabel">사진을 탭해서 색을 뽑으세요</div>
        <canvas id="colorPickCanvas"></canvas>
        <button id="cancelPickBtn" type="button" class="pickbtn">취소</button>
      </div>
      <button id="addColorBtn">+ 색상 추가</button>
      <div class="colorlist" id="colorListWrap"></div>
    </div>
  </div>
</main>

<script type="module">
const SECTIONS = ["A","B","C","D"];
const STATUSES = [
  {key:"before",  label:"도전 전", color:"#9CA3AF"},
  {key:"fail",    label:"실패",   color:"#EF4444"},
  {key:"doable",  label:"할만함", color:"#F59E0B"},
  {key:"split",   label:"나눠서", color:"#3B82F6"},
  {key:"success", label:"성공",   color:"#22C55E"},
];
const RANK = {before:0, fail:1, doable:2, split:3, success:4};
const stLabel = k => (STATUSES.find(s=>s.key===k)||{}).label || k;
const stColor = k => (STATUSES.find(s=>s.key===k)||{}).color || "#999";
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtShort(d){ if(!d) return ""; const p=d.split("-"); return parseInt(p[1])+"/"+parseInt(p[2]); }
function fmtFull(d){ return d ? d.replaceAll("-",".") : ""; }
function bestOf(history){
  if(!history || history.length===0) return {status:"before", date:null};
  let bestRank=-1, bestStatus="before";
  history.forEach(h=>{ const rk=RANK[h.status]; if(rk>bestRank){bestRank=rk; bestStatus=h.status;} });
  const dates = history.filter(h=>h.status===bestStatus).map(h=>h.date).sort();
  return {status:bestStatus, date:dates[0]};
}
function latestOf(history){
  return (history && history.length) ? history[history.length-1] : {status:"before", date:null};
}

// ===== 동적 색상 (등록 페이지에서 사용자가 등록) =====
function findColor(id){ return (data.colors||[]).find(c=>c.id===id); }
function colorHex(id){ const c=findColor(id); return c ? c.hex : "#9CA3AF"; }
function colorLbl(id){ const c=findColor(id); return c ? c.label : (id||"?"); }
function colorTextColor(id){ const c=findColor(id); return c ? (c.textColor||"#ffffff") : "#ffffff"; }

function hexToRgb(hex){
  hex = hex.replace("#","");
  return { r:parseInt(hex.substr(0,2),16)/255, g:parseInt(hex.substr(2,2),16)/255, b:parseInt(hex.substr(4,2),16)/255 };
}
function hexToHue(hex){
  const {r,g,b} = hexToRgb(hex);
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d===0) h=0;
  else if(max===r) h=60*(((g-b)/d)%6);
  else if(max===g) h=60*((b-r)/d+2);
  else h=60*((r-g)/d+4);
  if(h<0) h+=360;
  return h;
}
function hexSat(hex){
  const {r,g,b} = hexToRgb(hex);
  const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2;
  if(max===min) return 0;
  const d=max-min;
  return l>0.5 ? d/(2-max-min) : d/(max+min);
}
function hexLight(hex){
  const {r,g,b} = hexToRgb(hex);
  return (Math.max(r,g,b)+Math.min(r,g,b))/2;
}
function sortedColors(){
  const list = [...(data.colors||[])];
  return list.sort((a,b)=>{
    const sa=hexSat(a.hex), sb=hexSat(b.hex);
    const na = sa<0.15, nb = sb<0.15;
    if(na!==nb) return na ? 1 : -1;
    if(na && nb) return hexLight(a.hex)-hexLight(b.hex);
    return hexToHue(a.hex)-hexToHue(b.hex);
  });
}

function mkStorage(){
  return {
    A:{image:null, theme:"", changeDate:null, routes:[]},
    B:{image:null, theme:"", changeDate:null, routes:[]},
    C:{image:null, theme:"", changeDate:null, routes:[]},
    D:{image:null, theme:"", changeDate:null, routes:[]},
    archive:[],
    colors:[],
  };
}
const KEY = "climbing_tracker_v5";
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      SECTIONS.forEach(s=>{
        if(!d[s]) d[s] = {image:null, theme:"", changeDate:null, routes:[]};
        if(!d[s].routes) d[s].routes = [];
        d[s].theme = d[s].theme || "";
        d[s].changeDate = d[s].changeDate || null;
      });
      if(!d.archive) d.archive = [];
      if(!d.colors) d.colors = [];
      return d;
    }
  }catch(e){}
  return mkStorage();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
let data = load();
function pickLatestSector(){
  let best = null, bestDate = null;
  SECTIONS.forEach(s=>{
    const cd = data[s] && data[s].changeDate;
    if(cd && (!bestDate || cd > bestDate)){ bestDate = cd; best = s; }
  });
  return best;
}
let current = pickLatestSector() || "C";
let initialSectorPicked = !!pickLatestSector();
let statusFilter = [];
let levelFilter = [];
let expanded = new Set();

function renderPageTabs(){
  const el = document.getElementById("pageTabs");
  el.innerHTML = "";
  [["routes","문제"],["calendar","달력"]].forEach(([key,label])=>{
    const b = document.createElement("div");
    b.className = "navitem" + (page===key ? " active":"");
    b.textContent = label;
    b.onclick = ()=>{ page = key; renderAll(); };
    el.appendChild(b);
  });
}

function attachLongPress(el, cb){
  let timer = null, moved = false, sx=0, sy=0;
  const start = (x,y)=>{
    moved = false; sx=x; sy=y;
    timer = setTimeout(()=>{ if(!moved) cb(); }, 550);
  };
  const cancel = ()=>{ if(timer) clearTimeout(timer); timer=null; };
  el.addEventListener("pointerdown", e=>start(e.clientX, e.clientY));
  el.addEventListener("pointermove", e=>{
    if(Math.abs(e.clientX-sx)>10 || Math.abs(e.clientY-sy)>10){ moved=true; cancel(); }
  });
  el.addEventListener("pointerup", cancel);
  el.addEventListener("pointerleave", cancel);
  el.addEventListener("pointercancel", cancel);
  el.addEventListener("contextmenu", e=>e.preventDefault());
}

function goToRegister(sector){
  regSector = sector; regStaging = []; regPendingImage = undefined;
  const sec = data[sector];
  document.getElementById("regTheme").value = sec.theme || "";
  document.getElementById("regChangeDate").value = todayStr();
  page = "register"; renderAll();
}

function renderTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  SECTIONS.forEach(s=>{
    const b = document.createElement("div");
    b.className = "tab" + (s===current?" active":"");
    b.textContent = "Sector " + s;
    b.onclick = ()=>{ current = s; renderAll(); };
    el.appendChild(b);
  });
}

function renderSectorInfo(){
  const el = document.getElementById("sectorInfo");
  const sec = data[current];
  if(!sec.theme && !sec.changeDate){ el.textContent = ""; return; }
  let txt = "";
  if(sec.theme) txt += "\"" + sec.theme + "\"";
  if(sec.changeDate) txt += (txt?" · ":"") + fmtFull(sec.changeDate) + "부터";
  el.innerHTML = txt;
}

function renderWall(){
  const wa = document.getElementById("wallArea");
  wa.innerHTML = "";
  const sec = data[current];
  if(!sec.image){
    const ph = document.createElement("div");
    ph.className = "wallplaceholder";
    ph.textContent = "배치도 없음 · 길게 눌러서 문제 등록";
    attachLongPress(ph, ()=>goToRegister(current));
    wa.appendChild(ph);
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "wallwrap";
  const img = document.createElement("img");

async function fbGet(){

async function fbPut(record){

function reconcileSector(s, remote){
  if(!remote) return;
  const remoteRoutes = remote.routes || [];
  const remoteIds = new Set(remoteRoutes.map(rr=>rr.id));
  const oldById = {};
  data[s].routes.forEach(r=>{ oldById[r.id] = r; });
  data.archive = data.archive || [];
  data[s].routes.forEach(r=>{
    if(!remoteIds.has(r.id) && (r.history||[]).length){
      (r.history||[]).forEach(h=>{
        data.archive.push({sector:s, routeId:r.id, color:r.color, level:r.level, status:h.status, date:h.date});
      });
    }
  });
  data[s].routes = remoteRoutes.map(rr=>{
    const old = oldById[rr.id];
    return {id:rr.id, color:rr.color, level:rr.level, history: old ? (old.history||[]) : []};
  });
  if(remote.image !== undefined) data[s].image = remote.image;
  data[s].theme = remote.theme || "";
  data[s].changeDate = remote.changeDate || null;
}

let sharedOk = false;

async function syncFromShared(silent){
  if(!FIREBASE_READY) return;
  try{
    const remote = await fbGet();
    SECTIONS.forEach(s=> reconcileSector(s, remote[s]));
    data.colors = remote.colors || data.colors || [];
    save();
    sharedOk = true;
  }catch(e){
    sharedOk = false;
    if(!silent) console.warn("공유 저장소 연결 실패:", e.message);
  }
}

async function pushSectorToShared(sector){
  if(!FIREBASE_READY) return;
  const remote = await fbGet().catch(()=>({}));
  remote[sector] = {
    image: data[sector].image,
    theme: data[sector].theme || "",
    changeDate: data[sector].changeDate || null,
    routes: data[sector].routes.map(r=>({id:r.id, color:r.color, level:r.level}))
  };
  await fbPut(remote);
}

async function pushColorsToShared(){
  if(!FIREBASE_READY) return;
  const remote = await fbGet().catch(()=>({}));
  remote.colors = data.colors || [];
  await fbPut(remote);
}

function getAllEntries(){
  const out = [...(data.archive||[])];
  SECTIONS.forEach(s=>{

      (r.history||[]).forEach(h=>{
        out.push({sector:s, routeId:r.id, color:r.color, level:r.level, status:h.status, date:h.date});
      });
    });

}

function buildDayMap(){
  const raw = getAllEntries();
  const byDay = {};
  raw.forEach(e=>{
    const day = byDay[e.date] = byDay[e.date] || {};
    const key = e.sector + "|" + e.routeId;
    if(!day[key] || RANK[e.status] > RANK[day[key].status]) day[key] = e;
  });
  const result = {};
  Object.keys(byDay).forEach(d=>{ result[d] = Object.values(byDay[d]); });
  return result;
}

function renderCalendar(){
  const byDate = buildDayMap();
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById("calMonthLabel").textContent = y + "년 " + (m+1) + "월";

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  ["일","월","화","수","목","금","토"].forEach(d=>{
    const h = document.createElement("div");
    h.className = "calhead"; h.textContent = d;
    grid.appendChild(h);
  });
  const firstDow = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayS = todayStr();

  for(let i=0;i<firstDow;i++){
    const e = document.createElement("div");
    e.className = "calday empty2";
    grid.appendChild(e);
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const cell = document.createElement("div");
    cell.className = "calday" + (ds===todayS ? " today":"") + (ds===selectedDay ? " sel":"");
    const num = document.createElement("div");
    num.textContent = d;
    cell.appendChild(num);
    const dayEntries = byDate[ds];
    if(dayEntries && dayEntries.length){
      const dots = document.createElement("div");
      dots.className = "caldots";
      const statuses = [...new Set(dayEntries.map(e=>e.status))].slice(0,4);
      statuses.forEach(st=>{
        const dot = document.createElement("span");
        dot.className = "caldot";
        dot.style.background = stColor(st);
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
    }
    cell.onclick = ()=>{ selectedDay = ds; expandedLevels = new Set(); renderAll(); };
    grid.appendChild(cell);
  }

}

    el.innerHTML += '<div class="empty">이 날짜엔 기록이 없어요.</div>';
    return;
  }
  const byLevel = {};
  list.forEach(e=>{ (byLevel[e.level] = byLevel[e.level] || []).push(e); });
  const levels = Object.keys(byLevel).sort((a,b)=>(parseFloat(a)||0)-(parseFloat(b)||0));

      if(expandedLevels.has(lv)) expandedLevels.delete(lv); else expandedLevels.add(lv);
      renderAll();
    };
    el.appendChild(head);

    if(expandedLevels.has(lv)){
      entries.forEach(e=>{
        const row = document.createElement("div");
        row.className = "dayentry";

document.getElementById("colorPickCanvas").addEventListener("click", (e)=>{
  const canvas = e.target;
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = Math.floor((e.clientX-rect.left)*scaleX);
  const y = Math.floor((e.clientY-rect.top)*scaleY);
  const px = ctx.getImageData(x, y, 1, 1).data;
  const hex = "#" + [px[0],px[1],px[2]].map(v=>v.toString(16).padStart(2,"0")).join("");
  document.getElementById(pickTargetInputId).value = hex;
  document.getElementById("colorPickWrap").style.display = "none";
});

document.getElementById("addColorBtn").onclick = async ()=>{
  const label = document.getElementById("newColorLabel").value.trim();
  if(!label){ document.getElementById("newColorLabel").focus(); return; }
  const hex = document.getElementById("newColorBg").value;
  const textColor = document.getElementById("newColorText").value;
  const c = {id:"col"+Date.now()+Math.random().toString(36).slice(2,5), label, hex, textColor};
  data.colors = data.colors || [];
  data.colors.push(c);
  document.getElementById("newColorLabel").value = "";
  save(); renderAll();
  try{ await pushColorsToShared(); sharedOk = true; }
  catch(e){ alert("공유 저장소에 반영하지 못해서 이 기기에만 적용됐어요."); sharedOk = false; }
};

document.getElementById("regApplyBtn").onclick = async ()=>{
  const ok = confirm("Sector " + regSector + "의 기존 문제 " + data[regSector].routes.length + "개를 새 문제 " + regStaging.length + "개로 교체할까요?\n(과거 기록은 달력에 그대로 보존돼요)");
  if(!ok) return;
  data.archive = data.archive || [];
  data[regSector].routes.forEach(r=>{
    (r.history||[]).forEach(h=>{
      data.archive.push({sector:regSector, routeId:r.id, color:r.color, level:r.level, status:h.status, date:h.date});
    });
  });
  const newRoutes = regStaging.map((r,i)=>({
    id:"n"+Date.now()+i+Math.random().toString(36).slice(2,5),
    color:r.color, level:r.level, history:[]
  }));
  data[regSector].routes = newRoutes;
  data[regSector].theme = document.getElementById("regTheme").value.trim();
  data[regSector].changeDate = document.getElementById("regChangeDate").value || todayStr();
  if(regPendingImage !== undefined) data[regSector].image = regPendingImage;
  save();
  if(FIREBASE_READY){
    try{ await pushSectorToShared(regSector); sharedOk = true; }
    catch(e){ alert("공유 저장소에 반영하지 못해서 이 기기에만 적용됐어요.\n(" + e.message + ")"); sharedOk = false; }
  }
  regStaging = [];
  regPendingImage = undefined;
  current = regSector;
  page = "routes";
  renderAll();
};

function renderRegisterPage(){
  renderRegTabs();
  if(!document.getElementById("regChangeDate").value) document.getElementById("regChangeDate").value = todayStr();
  renderRegWall();
  renderRegColorOptions();
  renderColorList();
  renderRegStaging();
  document.getElementById("colorPanel").style.display = colorPanelOpen ? "block" : "none";
  document.getElementById("colorPanelToggle").textContent = "🎨 색상 설정" + (colorPanelOpen ? " ▲" : " ▾");
  const msg = document.getElementById("sharedStatusMsg");
  if(!FIREBASE_READY){
    msg.textContent = "⚠ 공유 저장소 미설정 — 코드 상단 firebaseConfig 값을 채우면 모두에게 공유돼요.";
  }else if(sharedOk){
    msg.textContent = "🟢 공유 저장소 연결됨 — 여기서 적용하면 모두에게 반영돼요.";
  }else{
    msg.textContent = "🔴 공유 저장소 연결 실패 — 이 기기에만 적용될 수 있어요.";
  }
}

let page = "routes";

function renderAll(){
  renderPageTabs();
  document.getElementById("routesPage").style.display = page==="routes" ? "block":"none";
  document.getElementById("calendarPage").style.display = page==="calendar" ? "block":"none";
  document.getElementById("registerPage").style.display = page==="register" ? "block":"none";
  document.getElementById("tabs").style.display = page==="routes" ? "flex":"none";
  if(page==="routes"){
    renderTabs();
    renderSectorInfo();
    renderWall();
    renderStatusFilter();
    renderLevelFilter();
    fillColorSelect(document.getElementById("newColor"));
    renderRoutes();
  }else if(page==="calendar"){
    renderCalendar();
  }else{
    renderRegisterPage();
  }
}

document.getElementById("regChangeDate").value = todayStr();
renderAll();
if(FIREBASE_READY){
  onSnapshot(SHARED_DOC(), (snap)=>{
    if(!snap.exists()) return;
    const remote = snap.data();
    SECTIONS.forEach(s=> reconcileSector(s, remote[s]));
    data.colors = remote.colors || data.colors || [];
    save();
    sharedOk = true;
    if(!initialSectorPicked){
      const picked = pickLatestSector();
      if(picked){ current = picked; initialSectorPicked = true; }
    }
    renderAll();
  }, (err)=>{ sharedOk = false; console.warn("Firestore 연결 실패:", err.message); renderAll(); });
}
</script>
</body>
</html>
